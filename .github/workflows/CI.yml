# This file was originally generated by maturin v1.7.0 (`maturin generate-ci github`).
# It has been customized for free-threaded wheels and resilience when setup-python /
# actions/python-versions temporarily lacks builds for a given OS/arch/version.
#
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-python@v5
        id: setup_freethreaded_314
        continue-on-error: true
        with:
          python-version: 3.14t
      - uses: actions/setup-python@v5
        id: setup_freethreaded_315
        continue-on-error: true
        with:
          python-version: 3.15t
      - name: Configure maturin interpreters
        shell: bash
        run: |
          INTERP='3.10 3.11 3.12 3.13 3.14 3.15'
          if [[ '${{ steps.setup_freethreaded_314.outcome }}' == 'success' ]]; then
            INTERP="$INTERP 3.14t"
          else
            echo '::warning::Free-threaded Python (3.14t) unavailable from setup-python; skipping cp314t wheels this run.'
          fi
          if [[ '${{ steps.setup_freethreaded_315.outcome }}' == 'success' ]]; then
            INTERP="$INTERP 3.15t"
          else
            echo '::warning::Free-threaded Python (3.15t) unavailable from setup-python; skipping cp315t wheels this run.'
          fi
          echo "MATURIN_INTERPRETERS=$INTERP pypy3.11" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.MATURIN_INTERPRETERS }}
          sccache: 'true'
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-python@v5
        id: setup_freethreaded_314
        continue-on-error: true
        with:
          python-version: 3.14t
      - uses: actions/setup-python@v5
        id: setup_freethreaded_315
        continue-on-error: true
        with:
          python-version: 3.15t
      - name: Configure maturin interpreters
        shell: bash
        run: |
          INTERP='3.10 3.11 3.12 3.13 3.14 3.15'
          if [[ '${{ steps.setup_freethreaded_314.outcome }}' == 'success' ]]; then
            INTERP="$INTERP 3.14t"
          else
            echo '::warning::Free-threaded Python (3.14t) unavailable from setup-python; skipping cp314t wheels this run.'
          fi
          if [[ '${{ steps.setup_freethreaded_315.outcome }}' == 'success' ]]; then
            INTERP="$INTERP 3.15t"
          else
            echo '::warning::Free-threaded Python (3.15t) unavailable from setup-python; skipping cp315t wheels this run.'
          fi
          echo "MATURIN_INTERPRETERS=$INTERP pypy3.11" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.MATURIN_INTERPRETERS }}
          sccache: 'true'
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v4
      # Windows: install standard CPython first, then install free-threaded
      # interpreters and run maturin for each available version.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
          architecture: ${{ matrix.platform.target }}
      - name: Configure maturin interpreters (standard CPython)
        shell: bash
        run: echo "MATURIN_INTERPRETERS_STD=3.10 3.11 3.12 3.13 3.14 3.15" >> "$GITHUB_ENV"
      - name: Build wheels (standard CPython)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.MATURIN_INTERPRETERS_STD }}
          sccache: 'true'
      - uses: actions/setup-python@v5
        id: setup_freethreaded_314
        continue-on-error: true
        with:
          python-version: 3.14t
          architecture: ${{ matrix.platform.target }}
      - uses: actions/setup-python@v5
        id: setup_freethreaded_315
        continue-on-error: true
        with:
          python-version: 3.15t
          architecture: ${{ matrix.platform.target }}
      - name: Warn if free-threaded Python unavailable
        if: steps.setup_freethreaded_314.outcome != 'success' || steps.setup_freethreaded_315.outcome != 'success'
        run: |
          if [[ '${{ steps.setup_freethreaded_314.outcome }}' != 'success' ]]; then
            echo '::warning::Free-threaded Python (3.14t) unavailable from setup-python; skipping cp314t wheels this run.'
          fi
          if [[ '${{ steps.setup_freethreaded_315.outcome }}' != 'success' ]]; then
            echo '::warning::Free-threaded Python (3.15t) unavailable from setup-python; skipping cp315t wheels this run.'
          fi
      - name: Build wheels (free-threaded Python 3.14)
        if: steps.setup_freethreaded_314.outcome == 'success'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i 3.14t
          sccache: 'true'
      - name: Build wheels (free-threaded Python 3.15)
        if: steps.setup_freethreaded_315.outcome == 'success'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i 3.15t
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
      - uses: actions/setup-python@v5
        id: setup_freethreaded_314
        continue-on-error: true
        with:
          python-version: 3.14t
      - uses: actions/setup-python@v5
        id: setup_freethreaded_315
        continue-on-error: true
        with:
          python-version: 3.15t
      - name: Configure maturin interpreters
        shell: bash
        run: |
          INTERP='3.10 3.11 3.12 3.13 3.14 3.15'
          if [[ '${{ steps.setup_freethreaded_314.outcome }}' == 'success' ]]; then
            INTERP="$INTERP 3.14t"
          else
            echo '::warning::Free-threaded Python (3.14t) unavailable from setup-python; skipping cp314t wheels this run.'
          fi
          if [[ '${{ steps.setup_freethreaded_315.outcome }}' == 'success' ]]; then
            INTERP="$INTERP 3.15t"
          else
            echo '::warning::Free-threaded Python (3.15t) unavailable from setup-python; skipping cp315t wheels this run.'
          fi
          echo "MATURIN_INTERPRETERS=$INTERP pypy3.11" >> "$GITHUB_ENV"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i ${{ env.MATURIN_INTERPRETERS }}
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  free-threaded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Try Python 3.15t. Use outcome (not conclusion) so continue-on-error
      # still lets us reliably detect an unavailable interpreter.
      - uses: actions/setup-python@v5
        id: py315t
        continue-on-error: true
        with:
          python-version: '3.15t'
      - uses: actions/setup-python@v5
        id: py314t
        continue-on-error: true
        with:
          python-version: '3.14t'
      - name: Resolve free-threaded interpreter
        id: ft_py
        run: |
          ready=false
          python_path=''
          if [[ '${{ steps.py315t.outcome }}' == 'success' ]]; then
            ready=true
            python_path='${{ steps.py315t.outputs.python-path }}'
          elif [[ '${{ steps.py314t.outcome }}' == 'success' ]]; then
            ready=true
            python_path='${{ steps.py314t.outputs.python-path }}'
          fi
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"
          echo "python_path=${python_path}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.ft_py.outputs.ready == 'true'
      - uses: astral-sh/setup-uv@v5
        if: steps.ft_py.outputs.ready == 'true'
      - name: Install dependencies (uv) and run tests
        if: steps.ft_py.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export UV_PYTHON='${{ steps.ft_py.outputs.python_path }}'
          uv sync --extra dev --locked
          uv run pytest tests/
      - name: Free-threaded Python unavailable
        if: steps.ft_py.outputs.ready != 'true'
        run: |
          echo '::notice::No free-threaded Python (3.15t or 3.14t) available from setup-python for this runner; skipping extension tests.'

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/')"
    needs: [linux, musllinux, windows, macos, free-threaded, sdist]
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
